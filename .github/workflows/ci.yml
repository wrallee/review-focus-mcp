name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies
        working-directory: ui
        run: npm install
      - name: Typecheck UI
        working-directory: ui
        run: npm run typecheck
      - name: Build embedded UI
        working-directory: ui
        run: npm run build
      - name: Test Go
        run: go test ./...
      - name: Build binary
        run: go build -o bin/review-focus-mcp ./cmd/review-focus
      - name: Build Docker image
        run: docker build -t review-focus-mcp:ci .
